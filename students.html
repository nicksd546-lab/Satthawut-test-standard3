    <style>

        h2 { border-left: 5px solid #0d233a; padding-left: 10px; color: #0d233a; margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #0d233a; color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-box h3 { font-size: 2rem; color: #dfb15b; margin-top: 5px; }
